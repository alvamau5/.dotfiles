# =============================================================================
# General Options
# =============================================================================

# set -g default-terminal "${TERM}"
set -sg terminal-overrides ",*:RGB"  # true color support
# set-option -g status-interval 1 # Refresh 'status-left' and 'status-right' more often
set -sg escape-time 0  # disable delays on escape sequences
set -g mouse on # Enable mouse mode
set -g renumber-windows on  # keep numbering sequential
set -g repeat-time 1000  # increase "prefix-free" window
set -g focus-events on # Enable focus events for applications like Neovim

# Shell Integration
set -g default-shell /bin/zsh
set -g default-command /bin/zsh

# # Use the current directory basename as the window name
# set -g automatic-rename on
# set -g automatic-rename-format '#{b:pane_current_path}'
# set -g allow-rename off

# Pane separators
set -g pane-border-lines simple # show pane titles at the top
set -g pane-border-style fg=white,bright
set -g pane-active-border-style fg=magenta

# Options: start indexes from 1
set -g base-index 1
set -g pane-base-index 1

# Change prefix
unbind C-b
set -g prefix `
bind ` send-prefix

# Theme: borders
set -g pane-border-lines simple
set -g pane-border-style fg=white,bright
set -g pane-active-border-style fg=magenta

# Theme: status
set -g status-style bg=default,fg=white,bright
set -g status-left ""
set -g status-right-length 100
# set -g status-right "#[fg=black,bg=blue] #{b:pane_current_path} #[default]#[fg=black,bg=blue] %H:%M |#[fg=black,bg=blue] %d-%b-%y"
# set -g status-right "#[fg=green]#(echo '#{pane_current_path}' | sed 's#$HOME#~#g') "
set -g status-right "#[fg=white,bright] #{b:pane_current_path} #[default] | %H:%M | %d-%b-%y"

# Theme: status (windows)
set -g window-status-format " #W "
set -g window-status-current-format " #W "

set -g window-status-current-style "#{?window_zoomed_flag,bg=yellow,bg=magenta,nobold}"
set -g window-status-bell-style "fg=red,nobold"

# Use Vi keybindings in copy and choice modes
set -g mode-keys vi

#Window navigation
bind j previous-window
bind k next-window

# Keybindings: wasd
bind w select-pane -U
bind a select-pane -L
bind s select-pane -D
bind d select-pane -R

# bind-key -r W resize-pane -U
# bind-key -r A resize-pane -L
# bind-key -r S resize-pane -D
# bind-key -r D resize-pane -R

# Keybindings: disable repeat for arrows
bind Up select-pane -U
bind Left select-pane -L
bind Down select-pane -D
bind Right select-pane -R
#
# Keybindings: split
bind v split-window -h
bind | split-window -h
bind h split-window -v
bind - split-window -v

# # Keybindings: windows
# bind -n C-Tab next-window
# bind -n C-M-Tab previous-window
